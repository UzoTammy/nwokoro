<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        :root {
            color-scheme: light;
        }

        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #1c1e21;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 48px 24px 96px;
        }

        h1 {
            font-size: 1.9rem;
            margin-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.3rem;
            margin-top: 2.2rem;
            border-bottom: 1px solid #e2e4e8;
            padding-bottom: 0.4rem;
        }

        h3 {
            font-size: 1.05rem;
            margin-top: 1.5rem;
        }

        p {
            color: #3c3f44;
        }

        ul {
            color: #3c3f44;
            padding-left: 1.4rem;
        }

        li {
            margin-bottom: 0.35rem;
        }

        strong {
            color: #101113;
        }

        a {
            color: #2957c9;
        }
    </style>
</head>

<body>
    <main>
        {{ content }}
    </main>
</body>

</html>
