{% extends 'core/base.html' %}

{% block content %}
<div class="container mt-3">
    <div class="row justify-content-center align-items-center vh-100">
        <div class="col-sm-6">
            <form class="mt-3" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <legend>Edit Note</legend>
                <hr>
                <div class="form-group">
                    <label>Title</label>
                    {{ form.title }}
                </div>
                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label>Priority</label>
                        {{ form.priority }}
                    </div>
                    <div class="form-group col-md-4">
                        <label>Category</label>
                        {{ form.category }}
                    </div>
                    <div class="form-group col-md-4">
                        <label>Status</label>
                        {{ form.status }}
                    </div>
                </div>
                <div class="form-group">
                    <label>Details</label>
                    {{ form.content }}
                </div>
                <div class="form-group">
                    <label>Attachment <small class="text-muted">(optional)</small></label>
                    {% if object.attachment %}
                    <div class="mb-2">
                        <a href="{{ object.attachment.url }}" target="_blank" class="small">
                            <i class="fa fa-paperclip mr-1"></i>{{ object.attachment.name|cut:"infodesk/" }}
                        </a>
                    </div>
                    {% endif %}
                    {{ form.attachment }}
                </div>

                <div class="m-2">
                    <button class="btn btn-outline-dark" type="submit">Save Changes</button>
                    <a class="btn btn-outline-dark float-right" href="{% url 'infodesk-list' %}">Back</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
